server:
  port: ${PORT:8086}

spring:
  profiles:
    default: local
  application:
    name: service-contrato
  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: 3
      minimum-idle: 1
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate

gateway:
  secret: ${GATEWAY_SECRET}

services:
  reserva:
    url: ${RESERVA_SERVICE_URL:http://localhost:8084}

management:
  endpoints:
    web:
      exposure:
        include: health,info
