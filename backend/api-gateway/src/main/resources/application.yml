server:
  port: ${PORT:8080}

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: service-auth
              uri: ${AUTH_SERVICE_URL:http://localhost:8087}
              predicates:
                - Path=/api/v1/auth/login,/api/v1/auth/perfil
            - id: service-cliente
              uri: ${CLIENTE_SERVICE_URL:http://localhost:8081}
              predicates:
                - Path=/api/v1/cliente/**
          globalcors:
            cors-configurations:
              '[/**]':
                allowedOrigins: "${FRONTEND_URL:http://localhost:3000}"
                allowedMethods: "*"
                allowedHeaders: "*"

services:
  auth:
    url: ${AUTH_SERVICE_URL:http://localhost:8087}

management:
  endpoints:
    web:
      exposure:
        include: health,info