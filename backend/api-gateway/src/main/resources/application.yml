server:
  port: ${PORT:8080}

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: service-auth
              uri: ${AUTH_SERVICE_URL:http://localhost:8087}
              predicates:
                - Path=/api/v1/auth/login,/api/v1/auth/perfil
            - id: service-cliente
              uri: ${CLIENTE_SERVICE_URL:http://localhost:8081}
              predicates:
                - Path=/api/v1/cliente,/api/v1/cliente/**
            # SVC-03 Flota: todas las rutas /api/v1/flota/** van a service-flota.
            # El filtro JwtValidationFilter ya validó el token antes de llegar aquí.
            - id: service-flota
              uri: ${FLOTA_SERVICE_URL:http://localhost:8083}
              predicates:
                - Path=/api/v1/flota/**
            # SVC-02 Reserva: /api/v1/reserva y todo lo que cuelga de ella.
            - id: service-reserva
              uri: ${RESERVA_SERVICE_URL:http://localhost:8084}
              predicates:
                - Path=/api/v1/reserva,/api/v1/reserva/**
          globalcors:
            cors-configurations:
              '[/**]':
                allowedOrigins: "${FRONTEND_URL:http://localhost:3000}"
                allowedMethods: "*"
                allowedHeaders: "*"

services:
  auth:
    url: ${AUTH_SERVICE_URL:http://localhost:8087}
gateway:
  internal-secret: ${GATEWAY_SECRET}

# Throttling del documento: la consulta de disponibilidad de flota se limita a 200 por minuto
# para proteger la base de datos. Ver FlotaRateLimitFilter. Si se pasa, el gateway responde 429.
rate-limit:
  flota-disponibilidad:
    por-minuto: ${FLOTA_RATE_LIMIT:200}

management:
  endpoints:
    web:
      exposure:
        include: health,info