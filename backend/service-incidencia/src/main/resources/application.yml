server:
  port: ${PORT:8085}

spring:
  application:
    name: service-incidencia
  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: 3
      minimum-idle: 1
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate

gateway:
  secret: ${GATEWAY_SECRET}

services:
  flota:
    url: ${FLOTA_SERVICE_URL:http://localhost:8083}

management:
  endpoints:
    web:
      exposure:
        include: health,info